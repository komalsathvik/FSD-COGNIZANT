<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Setting Up Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Exercise 1.2 local setup path after npm install bootstrap:
       <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  -->
</head>
<body>
  <main class="container py-5">
    <h1 class="text-primary mb-3">Bootstrap CDN Setup</h1>
    <p class="lead">This page uses Bootstrap 5 from CDN.</p>
    <button class="btn btn-success">Bootstrap Button</button>

    <section class="mt-5">
      <h2 class="h4">Downloaded/NPM File Usage</h2>
      <p class="mb-2">Required local file paths after installing Bootstrap:</p>
      <ul class="list-group">
        <li class="list-group-item">CSS: node_modules/bootstrap/dist/css/bootstrap.min.css</li>
        <li class="list-group-item">JS: node_modules/bootstrap/dist/js/bootstrap.bundle.min.js</li>
      </ul>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
