<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Bootstrap Structure and Files</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Bootstrap Files</h1>
    <div class="row g-3">
      <div class="col-md-4"><div class="border p-3 h-100"><h2 class="h5">css</h2><p class="mb-0">Contains compiled layout, utility, and component styles.</p></div></div>
      <div class="col-md-4"><div class="border p-3 h-100"><h2 class="h5">js</h2><p class="mb-0">Contains interactive plugins such as modal, collapse, dropdown, and tooltip.</p></div></div>
      <div class="col-md-4"><div class="border p-3 h-100"><h2 class="h5">icons</h2><p class="mb-0">Contains icon font, SVGs, and icon CSS files.</p></div></div>
    </div>
    <button class="btn btn-primary mt-4" data-bs-toggle="collapse" data-bs-target="#pluginCheck">Test JS Plugin</button>
    <div class="collapse mt-3" id="pluginCheck">
      <div class="card card-body">bootstrap.bundle.min.js is loaded.</div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
