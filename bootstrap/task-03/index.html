<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Responsive Grid Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Responsive Grid</h1>
    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4"><div class="bg-primary text-white p-4">Column 1</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="bg-success text-white p-4">Column 2</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="bg-warning p-4">Column 3</div></div>
    </div>
  </main>
</body>
</html>
