<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Column Layouts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Column Layouts</h1>
    <section class="row g-3 mb-5">
      <aside class="col-md-3"><div class="bg-light border p-3">Sidebar col-md-3</div></aside>
      <article class="col-md-9"><div class="bg-white border p-3">Content area col-md-9</div></article>
    </section>
    <section class="row g-3">
      <div class="col-sm-3"><div class="bg-info-subtle p-3">One</div></div>
      <div class="col-sm-3"><div class="bg-info-subtle p-3">Two</div></div>
      <div class="col-sm-3"><div class="bg-info-subtle p-3">Three</div></div>
      <div class="col-sm-3"><div class="bg-info-subtle p-3">Four</div></div>
    </section>
  </main>
</body>
</html>
