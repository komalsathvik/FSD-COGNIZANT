<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 7 - Typography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="display-1">Display Heading</h1>
    <p class="lead">This paragraph uses the lead class.</p>
    <p class="text-muted">This text is muted.</p>
    <p class="fw-bold">This text is bold.</p>
    <p class="text-uppercase">uppercase utility</p>
    <p class="text-lowercase">LOWERCASE UTILITY</p>
    <p class="text-capitalize">capitalize every word</p>
  </main>
</body>
</html>
