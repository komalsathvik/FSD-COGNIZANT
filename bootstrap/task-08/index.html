<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 8 - Forms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Registration Form</h1>
    <form class="row g-3 mb-5">
      <div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" id="name" type="text"></div>
      <div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email"></div>
      <div class="col-12">
        <label class="form-label" for="phone">Phone</label>
        <div class="input-group"><span class="input-group-text">+91</span><input class="form-control" id="phone" type="tel"></div>
      </div>
      <div class="col-12 form-check ms-2"><input class="form-check-input" id="terms" type="checkbox"><label class="form-check-label" for="terms">Accept terms</label></div>
      <div class="col-12"><button class="btn btn-primary" type="submit">Register</button></div>
    </form>
    <h2 class="h4 mb-3">Login Form</h2>
    <form class="border rounded p-4">
      <div class="form-floating mb-3"><input class="form-control" id="loginEmail" type="email" placeholder="name@example.com"><label for="loginEmail">Email address</label></div>
      <div class="form-floating mb-3"><input class="form-control" id="loginPassword" type="password" placeholder="Password"><label for="loginPassword">Password</label></div>
      <button class="btn btn-success" type="submit">Login</button>
    </form>
  </main>
</body>
</html>
