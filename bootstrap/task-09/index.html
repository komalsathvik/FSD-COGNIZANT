<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 9 - Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Buttons</h1>
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-warning">Warning</button>
      <button class="btn btn-info">Info</button>
      <button class="btn btn-light">Light</button>
      <button class="btn btn-dark">Dark</button>
      <button class="btn btn-outline-primary">Outline Primary</button>
      <button class="btn btn-outline-danger">Outline Danger</button>
    </div>
    <div class="btn-group mb-4" role="group" aria-label="Button group">
      <button class="btn btn-outline-secondary">Left</button>
      <button class="btn btn-outline-secondary">Middle</button>
      <button class="btn btn-outline-secondary">Right</button>
    </div>
    <div class="btn-group d-block" role="group" aria-label="Toggle buttons">
      <input class="btn-check" id="toggle1" type="checkbox" autocomplete="off">
      <label class="btn btn-outline-primary" for="toggle1">Toggle One</label>
      <input class="btn-check" id="toggle2" type="checkbox" autocomplete="off">
      <label class="btn btn-outline-primary" for="toggle2">Toggle Two</label>
    </div>
  </main>
</body>
</html>
