<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 11 - Cards and Media Objects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card">
          <img class="card-img-top" src="https://placehold.co/600x360?text=Profile" alt="Profile placeholder">
          <div class="card-body">
            <h1 class="card-title h5">Aarav Sharma</h1>
            <p class="card-text">Frontend trainee learning Bootstrap components.</p>
            <a class="btn btn-primary" href="#">View Profile</a>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="media d-flex align-items-start border p-3">
          <img class="me-3 rounded" src="https://placehold.co/96x96?text=Img" alt="Media placeholder">
          <div>
            <h2 class="h5">Media Object Layout</h2>
            <p class="mb-0">The image is aligned to the left and the content stays on the right using Bootstrap flex utilities.</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
