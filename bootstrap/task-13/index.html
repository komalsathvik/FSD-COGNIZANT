<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 13 - Colors and Backgrounds</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Dashboard Colors</h1>
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="bg-primary text-white p-3">Users: 120</div></div>
      <div class="col-md-3"><div class="bg-warning text-dark p-3">Pending: 18</div></div>
      <div class="col-md-3"><div class="bg-success text-white p-3">Complete: 84</div></div>
      <div class="col-md-3"><div class="bg-danger text-white p-3">Issues: 6</div></div>
    </div>
    <section class="bg-dark bg-gradient text-white p-5">
      <h2 class="h4">Gradient Panel</h2>
      <p class="mb-0">Uses bg-gradient with bg-dark and white text.</p>
    </section>
  </main>
</body>
</html>
