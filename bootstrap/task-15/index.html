<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 15 - Borders, Shadows, Rounded Corners</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Borders and Shadows</h1>
    <img class="border border-primary border-3 rounded-circle mb-4" src="https://placehold.co/160x160?text=Photo" alt="Rounded placeholder">
    <div class="card shadow-lg rounded-pill">
      <div class="card-body text-center">
        <h2 class="h5 mb-1">Rounded Pill Card</h2>
        <p class="mb-0">Uses shadow, shadow-lg style strength, and rounded-pill.</p>
      </div>
    </div>
  </main>
</body>
</html>
