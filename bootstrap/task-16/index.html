<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 16 - Positioning Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="pb-5">
  <main class="container py-5">
    <h1 class="mb-4">Positioning Utilities</h1>
    <div class="position-relative d-inline-block">
      <img class="rounded" src="https://placehold.co/260x180?text=Product" alt="Product placeholder">
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">New</span>
    </div>
  </main>
  <footer class="position-fixed bottom-0 start-0 end-0 bg-dark text-white text-center p-3">Fixed footer using position-fixed bottom-0</footer>
</body>
</html>
