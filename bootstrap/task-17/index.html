<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 17 - Bootstrap Icons</title>

      <a class="text-white" href="#" aria-label="Facebook"><i class="bi bi-facebook fs-4"></i></a>

      <a class="text-white" href="#" aria-label="GitHub"><i class="bi bi-github fs-4"></i></a>
