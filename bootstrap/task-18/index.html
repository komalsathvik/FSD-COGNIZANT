<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 18 - JavaScript Plugins</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-4">Bootstrap JavaScript Plugins</h1>
    <button class="btn btn-primary mb-4" data-bs-toggle="modal" data-bs-target="#sampleModal">Open Modal</button>
    <div class="modal fade" id="sampleModal" tabindex="-1" aria-labelledby="sampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h2 class="modal-title fs-5" id="sampleModalLabel">Modal Popup</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button></div>
          <div class="modal-body">This modal is triggered by a button.</div>
          <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Close</button></div>
        </div>
      </div>
    </div>
    <div class="accordion" id="sampleAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#panelOne">Accordion Item 1</button></h2>
        <div class="accordion-collapse collapse show" id="panelOne" data-bs-parent="#sampleAccordion"><div class="accordion-body">First collapsible panel.</div></div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelTwo">Accordion Item 2</button></h2>
        <div class="accordion-collapse collapse" id="panelTwo" data-bs-parent="#sampleAccordion"><div class="accordion-body">Second collapsible panel.</div></div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
