    <link rel="stylesheet" href="styles.css">

<body>

        </tr>
        <tr>

            <td><img src="images/event6.svg" alt="Art workshop" title="Art Workshop" class="event-image"><br>Art Workshop</td>
        </tr>
    </table>
</body>
</html>
