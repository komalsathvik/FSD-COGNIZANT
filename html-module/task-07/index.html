<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Invite</title>
</head>
<body>
    <h1>Event Video Invite</h1>

    <video width="400" controls oncanplay="videoReady()">
        <source src="event-invite.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <p id="videoMessage"></p>

    <h2>Quick Interest Form</h2>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" onchange="markChanged()">
    </form>

    <script src="script.js"></script>
</body>
</html>
